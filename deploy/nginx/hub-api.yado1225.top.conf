# yado Hub 服务站点
# 反代目标是 compose 中的 yado-hub 服务，容器内端口 7791
# 放到服务器 /opt/yado/nginx/conf.d/ 下

server {
    listen 80;
    server_name hub-api.yado1225.top;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name hub-api.yado1225.top;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        # 用变量形式指定后端，让 nginx 在请求时才解析容器名。
        # 若直接写 proxy_pass http://yado-hub:7791，后端容器不在时整个 nginx 起不来，
        # 会连带登录服务和其他 API 一起挂。
        resolver 127.0.0.11 valid=10s;
        set $upstream_be "yado-hub:7791";

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 使用变量后必须显式带 $request_uri，否则转发的是规范化后的路径
        proxy_pass http://$upstream_be$request_uri;
    }
}
